name: ${FOODLAB_STACK_NAME:-foodlab-supabase}
services:
  db:
    image: supabase/postgres:17.6.1.136
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run setup-selfhost first}
      POSTGRES_DB: postgres
      POSTGRES_HOST: /var/run/postgresql
      PGPORT: 5432
      JWT_EXP: 3600
    volumes:
      - ${FOODLAB_RUNTIME:?}/data:/var/lib/postgresql/data
      - ${FOODLAB_RUNTIME:?}/db-config:/etc/postgresql-custom
      - ./roles.sql:/docker-entrypoint-initdb.d/init-scripts/99-foodlab-roles.sql:ro
    healthcheck:
      test: [CMD, pg_isready, -U, postgres, -h, localhost]
      interval: 3s
      timeout: 5s
      retries: 40
    command: [postgres, -c, config_file=/etc/postgresql/postgresql.conf, -c, log_min_messages=warning]
  auth:
    image: supabase/gotrue:v2.197.0
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - '127.0.0.1:${FOODLAB_AUTH_PORT:-54331}:9999'
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: 9999
      API_EXTERNAL_URL: http://localhost:3000/supabase/auth/v1
      GOTRUE_SITE_URL: http://localhost:3000
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://supabase_auth_admin:${POSTGRES_PASSWORD}@db:5432/postgres
      GOTRUE_DB_MAX_POOL_SIZE: 10
      GOTRUE_JWT_SECRET: ${JWT_SECRET:?}
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_JWT_ADMIN_ROLES: service_role
      GOTRUE_JWT_EXP: 3600
      GOTRUE_DISABLE_SIGNUP: 'false'
      GOTRUE_EXTERNAL_EMAIL_ENABLED: 'true'
      GOTRUE_EXTERNAL_PHONE_ENABLED: 'false'
      GOTRUE_EXTERNAL_ANONYMOUS_USERS_ENABLED: 'false'
      GOTRUE_MAILER_AUTOCONFIRM: 'true'
      GOTRUE_SECURITY_MIN_PASSWORD_LENGTH: 12
      GOTRUE_LOG_LEVEL: warn
      NO_PROXY: localhost,127.0.0.1,db,auth,rest
      no_proxy: localhost,127.0.0.1,db,auth,rest
    healthcheck:
      test: [CMD, wget, -Y, 'off', --quiet, --tries=1, --spider, http://127.0.0.1:9999/health]
      interval: 3s
      timeout: 5s
      retries: 40
  rest:
    image: postgrest/postgrest:v14.18
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - '127.0.0.1:${FOODLAB_REST_PORT:-54332}:3000'
    volumes:
      - ./rest-health.conf:/etc/foodlab-health.conf:ro
    environment:
      PGRST_DB_URI: postgres://authenticator:${POSTGRES_PASSWORD}@db:5432/postgres
      PGRST_DB_SCHEMAS: public
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: ${JWT_SECRET:?}
      PGRST_DB_USE_LEGACY_GUCS: 'false'
      PGRST_DB_MAX_ROWS: 1000
      PGRST_ADMIN_SERVER_PORT: 3001
    healthcheck:
      test: [CMD, postgrest, /etc/foodlab-health.conf, --ready]
      interval: 3s
      timeout: 5s
      retries: 40
